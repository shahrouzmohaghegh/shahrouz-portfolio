# Monthly facts on every version this project holds back by hand: the
# Dependabot ignore rules in .github/dependabot.yml and the gitleaks binary
# pinned in ci.yml, which Dependabot does not track. scripts/pin-review.mts
# keeps one issue, "Dependency pins to review", current with the report. It
# changes no dependency and merges nothing.

name: Pin review

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The script uses only Node built-ins, so there is no npm ci. A failed
      # fetch fails the job before any issue is written.
      - name: Report and update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/pin-review.mts

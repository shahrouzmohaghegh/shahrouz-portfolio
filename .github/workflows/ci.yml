# The gate. Every pull request, and every push to main, runs the full
# current gate, in order; any failing step fails the job. Branch protection on main requires
# this job, so nothing merges (and Vercel deploys nothing) unless it passes.
# The git hooks in .githooks/ run a subset locally, but hooks are skippable,
# so this job is the guarantee.

name: CI

on:
  # Pushes only to main, so a pull request's head commit carries exactly one
  # gate result, from the pull request run, where the content review check
  # applies. A push run on a topic branch would pass that check and could
  # stand in for a failing pull request run.
  push:
    branches: [main]
  # edited as well as the defaults, so ticking the content review box in a
  # pull request body re-runs the gate with the new body (a re-run of an
  # old job reads the old one).
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04 # pinned; move to a newer image deliberately, in a pull request
    # The browser checks (axe on every page at four widths, thirty
    # Lighthouse runs) take several minutes on top of the rest.
    timeout-minutes: 40
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # scripts/check-repo.mts reads the confidential terms from the untracked
      # .forbidden-terms file. The list lives in a repository secret, never in
      # the repo. Missing or empty fails closed. Runs triggered by Dependabot
      # read Dependabot secrets, not Actions secrets, so FORBIDDEN_TERMS must
      # exist in both the Actions and the Dependabot secret stores.
      - name: Restore confidential term list
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "$(printf '%s' "$FORBIDDEN_TERMS" | tr -d '[:space:]')" ]; then
            echo "::error::Repository secret FORBIDDEN_TERMS is missing or empty, so the repository scan cannot run."
            exit 1
          fi
          printf '%s\n' "$FORBIDDEN_TERMS" > .forbidden-terms

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Script tests
        run: npm run test:scripts

      - name: Unit tests
        run: npm run test

      - name: Build
        id: build
        run: npm run build

      - name: Token drift check
        run: npm run check:tokens

      - name: Repository scan (tree, every blob and commit message in history)
        run: node scripts/check-repo.mts --history

      # gitleaks runs as a checksum-verified release binary rather than an
      # action, so it scans full history on every event. Dependabot does not
      # track this pin; bump the version and checksum by hand.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-connrefused -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1

      # Every package in package.json has a one-line reason in the README's
      # Dependencies table, and every relative README link is a tracked file.
      - name: README check
        run: npm run check:readme

      # A pull request that changes content/ fails until its body has the
      # "Shahrouz reviewed the content wording" box from
      # .github/pull_request_template.md ticked. Other events pass and say why.
      - name: Content review check
        run: npm run check:content-review

      # Chromium for the browser checks below, from the pinned
      # @playwright/test, with the system libraries it needs on this image.
      # This step and the server start run whenever the build succeeded, even
      # after a deterministic check above failed (an unticked content review
      # box, most often), so one run still reports every server check. The
      # gate stays red either way.
      - name: Install Chromium (Playwright)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      # The one server stage. Starts the build with next start on a local
      # port, in the background, waits until it answers and checks the
      # process is still alive, then leaves it running: every step below,
      # up to "Stop the built site", reads this one server. Each server check
      # runs whenever the server started, even after another one failed, so
      # one run reports them all. The deterministic
      # checks above never depend on it, so a browser or network hiccup here
      # never stops them from running.
      - name: Start the built site (next start)
        id: site
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          nohup ./node_modules/.bin/next start --port 3000 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next-start.pid"
          deadline=$((SECONDS + 60))
          until curl -s -o /dev/null --max-time 1 http://localhost:3000/; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::next start did not answer on http://localhost:3000 within 60 seconds."
              cat "$RUNNER_TEMP/next-start.log"
              exit 1
            fi
            sleep 1
          done
          if ! kill -0 "$(cat "$RUNNER_TEMP/next-start.pid")" 2>/dev/null; then
            echo "::error::the next start process has exited, so whatever answered on port 3000 is not this build."
            cat "$RUNNER_TEMP/next-start.log"
            exit 1
          fi

      # Story 5.2 and 5.6: the link check's crawl (every route, both detail
      # families, every filter state), read with plain fetch. Fails on a
      # confidential term from .forbidden-terms (the education credential
      # exempt), departure language, a headcount above 38, a Headline Metric
      # without its qualifier, a canonical route with noindex or no
      # description, and a sitemap or robots.txt that drifts. Failures name
      # the page and the rule, never the term.
      - name: Content check (every page rendered, confidentiality and metadata)
        if: always() && steps.site.outcome == 'success'
        run: npm run check:content -- http://localhost:3000

      # Story 5.3 and 5.5: Chromium with axe-core on every crawled page; any
      # serious or critical violation, a missing or doubled landmark, a
      # skipped heading level, a focus ring under 3:1 against its ground, or
      # sideways scroll at 320, 375, 768 or 1440 fails.
      - name: Accessibility and width check (axe, landmarks, focus, four widths)
        if: always() && steps.site.outcome == 'success'
        run: npm run check:a11y -- http://localhost:3000

      # Story 5.1: the one Playwright test (AD-18), Home at 375 x 550.
      - name: End-to-end test (UJ-1 skim at 375 x 550)
        if: always() && steps.site.outcome == 'success'
        env:
          BASE_URL: http://localhost:3000
        run: npm run test:e2e

      # Story 5.4: Lighthouse on six pages, mobile and desktop, median of
      # three runs; every category at least 90 and Home's mobile LCP under
      # 2.0s; the AD-12 portrait rules and the NFR-7 client code budget.
      - name: Lighthouse check (six pages, mobile and desktop)
        if: always() && steps.site.outcome == 'success'
        run: npm run check:lighthouse -- http://localhost:3000

      # Every internal page answers 200 (404 for the not-found pages and
      # unwritten detail slugs), every external link answers 200
      # (LinkedIn's bot block of 999 or 429 is reported, not failed), each
      # project's repository link is the expected public one, and no link or
      # page points at a repository off the public allowlist of
      # repositories. Launch-blocking. It runs last of the server checks,
      # because it is the only step that depends on other sites.
      - name: Link check (every page and external link)
        if: always() && steps.site.outcome == 'success'
        run: npm run check:links -- http://localhost:3000

      - name: Stop the built site
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/next-start.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/next-start.pid")" 2>/dev/null || true
          fi

      # Branch protection is what keeps a red gate out of production, so the
      # gate checks the part of it the public branch endpoint shows: main
      # protected, required checks enforced for admins too, and gate among
      # them. Pull request, strict and force push settings are not visible
      # there and are not checked. It uses this job's read-only token; no
      # admin token. Drift fails with "has drifted:" and the list; an outage
      # (network, timeout or HTTP error after one retry) fails with "could
      # not read" instead, and a re-run once GitHub recovers clears it.
      # always(), so a failing step above (a pending content review, say)
      # never hides whether protection still holds.
      - name: Branch protection check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-protection.mts
